# The frontend's server (F6): the built app's files, its runtime configuration, and the
# security headers deploy/start.sh writes. Non-root, on 8080; nothing written outside /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
  worker_connections 1024;
}

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # Paths only: nothing the app sends carries a secret, and it should stay that way.
  log_format path '$remote_addr "$request_method $uri" $status $body_bytes_sent $request_time';
  access_log /dev/stdout path;

  sendfile on;
  server_tokens off;
  keepalive_timeout 65;
  # The app only ever GETs from here.
  client_max_body_size 1k;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    # add_header in a location replaces the server's, so each location includes them.

    # Built files have their hash in their name: kept a year.
    location /assets/ {
      include /tmp/vaultgate/headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # This deployment's settings, written at start.
    location = /config.json {
      include /tmp/vaultgate/headers.conf;
      add_header Cache-Control "no-store" always;
      alias /tmp/vaultgate/config.json;
    }

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Everything else is the app, whose router reads the path: index.html, checked
    # for a new version on every load.
    location / {
      include /tmp/vaultgate/headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri /index.html;
    }
  }
}
