name: Release

# A release is a vX.Y.Z tag on a commit of main. Nothing is rebuilt: the image CI
# published for that commit (ghcr.io/<owner>/vaultgate-frontend:<commit>) gets the
# version as a second tag, and the GitHub Release is made from the notes reviewed with
# the change (docs/releases/vX.Y.Z.md). VaultGate's releases name the frontend release
# they pair with.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub Release
      packages: write # the version tag on the image
    env:
      TAG: ${{ github.ref_name }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/vaultgate-frontend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # to check the tagged commit is on main

      - name: The tag is on main, matches package.json, and has its notes
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "$TAG is not on main" >&2; exit 1; }
          [[ $TAG =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "not a vX.Y.Z tag: $TAG" >&2; exit 1; }
          version=$(node -p "require('./package.json').version")
          [[ $version == "${BASH_REMATCH[1]}" ]] \
            || { echo "package.json says $version, the tag $TAG" >&2; exit 1; }
          [[ -s docs/releases/$TAG.md ]] || { echo "no docs/releases/$TAG.md" >&2; exit 1; }

      # imagetools copies the manifest under the new tag; the digest check proves the
      # version names the very image the commit tag does. A commit with no published
      # image (one that never reached main's CI) fails here, before anything is released.
      - name: Tag the commit's image with the version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create -t "$IMAGE:$TAG" "$IMAGE:$GITHUB_SHA"
          commit=$(docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" --format '{{json .Manifest.Digest}}')
          version=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest.Digest}}')
          [[ $commit == "$version" ]] || { echo "$IMAGE:$TAG is not $IMAGE:$GITHUB_SHA" >&2; exit 1; }
          echo "ok  $IMAGE:$TAG = $GITHUB_SHA ($version)"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$TAG" --verify-tag --title "vaultgate-frontend $TAG" --notes-file "docs/releases/$TAG.md"
