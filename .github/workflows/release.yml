name: Release

# A release is a vX.Y.Z tag on a commit of main whose CI run passed. Nothing is
# rebuilt: the image CI published for that commit (ghcr.io/<owner>/vaultgate-frontend:
# <commit>) gets the version as a second tag, and the GitHub Release is made, or updated,
# from the notes reviewed with the change (docs/releases/vX.Y.Z.md), with an SBOM of
# the image (SPDX JSON, by Trivy) attached. VaultGate's releases name the frontend
# release they pair with.
#
# The tag can be pushed with git, or created by publishing a release on GitHub (whose
# text this then replaces with the notes). Run by hand with a tag, it does the same for
# that tag with this workflow as it is now: to finish or repair a release.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag (vX.Y.Z), already on GitHub
        required: true

permissions:
  contents: read

# One run per tag at a time: a release published on GitHub and a run by hand don't race.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub Release
      packages: write # the version tag on the image
      actions: read # CI's result for the tagged commit
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/vaultgate-frontend
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0 # to check the tagged commit is on main

      # The tag's commit, not the run's: a run by hand runs on main's.
      - name: The tag is on main, matches package.json, and has its notes
        run: |
          [[ $TAG =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "not a vX.Y.Z tag: $TAG" >&2; exit 1; }
          want=${BASH_REMATCH[1]}
          commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          echo "COMMIT=$commit" >> "$GITHUB_ENV"
          git merge-base --is-ancestor "$commit" origin/main \
            || { echo "$TAG is not on main" >&2; exit 1; }
          version=$(node -p "require('./package.json').version")
          [[ $version == "$want" ]] || { echo "package.json says $version, the tag $TAG" >&2; exit 1; }
          [[ -s docs/releases/$TAG.md ]] || { echo "no docs/releases/$TAG.md" >&2; exit 1; }

      # A published image isn't yet a released one: only a commit whose CI run on main
      # succeeded, every job, is released.
      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          conclusions=$(gh run list --workflow ci.yml --commit "$COMMIT" --branch main \
            --event push --json conclusion --jq '[.[].conclusion] | join(" ")')
          [[ " $conclusions " == *" success "* ]] \
            || { echo "no successful CI run on main for $COMMIT (found: ${conclusions:-none})" >&2; exit 1; }
          echo "ok  CI passed on $COMMIT"

      # --prefer-index=false copies the image's manifest as it is: by default imagetools
      # wraps a single image in a new index, under another digest. The digest check
      # proves the version names the very image the commit tag does. A commit with no
      # published image (one that never reached main's CI) fails here, before anything
      # is released.
      - name: Tag the commit's image with the version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create --prefer-index=false -t "$IMAGE:$TAG" "$IMAGE:$COMMIT"
          built=$(docker buildx imagetools inspect "$IMAGE:$COMMIT" --format '{{json .Manifest.Digest}}')
          released=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest.Digest}}')
          [[ $built == "$released" ]] || { echo "$IMAGE:$TAG is not $IMAGE:$COMMIT" >&2; exit 1; }
          echo "ok  $IMAGE:$TAG = $COMMIT ($released)"

      # What is in the released image, package by package, from the very image the
      # version names (by digest). Signed in as the job, so it works whether or not the
      # package is public; the token goes in by name, never on a command line.
      - name: SBOM of the image
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          digest=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD -v "$RUNNER_TEMP/assets:/out" \
            aquasec/trivy:0.76.2 image --quiet \
            --format spdx-json --output "/out/vaultgate-frontend-$TAG.spdx.json" "$IMAGE@$digest"
          ls -l "$RUNNER_TEMP/assets"

      # Made from the notes, or, for a release already published on GitHub, given them.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "vaultgate-frontend $TAG" --notes-file "docs/releases/$TAG.md"
          else
            gh release create "$TAG" --verify-tag --title "vaultgate-frontend $TAG" \
              --notes-file "docs/releases/$TAG.md"
          fi
          # Replaced when the release is done again (a run by hand).
          gh release upload "$TAG" "$RUNNER_TEMP"/assets/* --clobber
